name: Hail data

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.html"

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hail-data
    steps:
      - uses: actions/checkout@v6

      - name: Build hail data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hail_builder.py

      - name: Build hail report page
        continue-on-error: true
        run: python3 hail_pages.py > changed-pages.txt

      - name: Save hail data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hail-data
          git add hail-report.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update hail data"
          git pull --rebase
          git push

      - name: Refresh the website
        continue-on-error: true
        run: >
          curl -fsS -X POST
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: Tell Bing about a changed hail report
        continue-on-error: true
        run: python3 indexnow.py changed-pages.txt

  bing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Tell Bing which pages changed
        continue-on-error: true
        run: |
          git diff --name-only HEAD~1 HEAD > changed-pages.txt || git ls-files "*.html" > changed-pages.txt
          python3 indexnow.py changed-pages.txt
